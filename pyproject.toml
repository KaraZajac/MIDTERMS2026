[project]
name = "midterms2026"
version = "0.1.0"
description = "An open, FiveThirtyEight-style forecast of the 2026 U.S. midterm elections: polls, fundamentals and expert ratings combined into correlated simulations of the House, Senate and governorships, timestamped before Election Day and scored after."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kara Zajac" }]
dependencies = ["pyyaml>=6.0", "numpy>=1.26"]

[project.optional-dependencies]
# Heavier stack for exploratory analysis, not required by the pipeline/model.
analysis = ["pandas>=2.0", "matplotlib>=3.8"]

[project.scripts]
midterms = "midterms.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["midterms*"]
