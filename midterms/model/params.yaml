# Model parameters. Each carries `basis`: `fit` (re-estimated by
# `midterms backtest` / the poll adjuster from data in this repo) or
# `prior` (set from the published forecasting literature, documented in
# docs/method.md, and open to being overturned by a backtest).

national:
  # sd of the shared (national) polling error at E-3, on the statewide-poll
  # scale. The statewide backtest (data/backtest_statewide.yaml) estimates it,
  # net of race-level noise, at ~3.6 across the midterm-like cycles (2014,
  # 2018, 2022 and the 2025 NJ/VA governorships) and ~4.3 across all; 3.5.
  # Its sign is not modeled: those misses ran both ways (2025: +6.8 toward D).
  sd: {value: 3.5, basis: fit-informed}
  # how much of that error each chamber's forecast carries. Senate and
  # governor polls shared the cycle-level miss fully in the backtest; the
  # House rides on the generic ballot, whose misses have run smaller (prior),
  # and carries its own measured translation error on top.
  loading: {value: {house: 0.7, senate: 1.0, governor: 1.0}, basis: prior}
  nu: {value: 5, basis: prior}          # t tails: rare large misses (2014)
  generic_half_life_days: {value: 10, basis: prior}

shared:
  sd_region: {value: 1.5, basis: prior}
  sd_state: {value: 1.8, basis: prior}
  nu_race: {value: 6, basis: prior}

house:
  lean_coef: {value: 1.0, basis: prior}       # district swing ~ uniform
  lean_weight_2024: {value: 0.75, basis: prior}  # vs 2020, where both exist
  incumbency: {value: 3.0, basis: prior}      # margin pts for a running incumbent
  freshman_bonus: {value: 1.0, basis: prior}  # first-term incumbents' extra
  money_coef: {value: 1.2, basis: prior}      # pts per doubling of D/R receipts
  money_cap: {value: 4.0, basis: prior}
  sd_fundamentals: {value: 6.0, basis: prior}
  sd_fundamentals_open: {value: 7.0, basis: prior}
  translation_sd: {value: 2.0, basis: prior}  # national vote -> district baseline instability
  # lean_coef, incumbency, money_coef, sd_fundamentals(_open), translation_sd
  # are overwritten by `midterms backtest` fits (data/backtest.yaml) when present

senate:
  lean_coef: {value: 0.85, basis: prior}
  incumbency: {value: 2.5, basis: prior}
  sd_fundamentals: {value: 8.5, basis: prior}

governor:
  lean_coef: {value: 0.55, basis: prior}      # governors are less nationalized
  national_coef: {value: 0.6, basis: prior}
  incumbency: {value: 4.0, basis: prior}
  sd_fundamentals: {value: 11.0, basis: prior}

polls:
  half_life_days: {value: 14, basis: prior}
  max_age_days: {value: 150, basis: prior}
  sd_nonsampling: {value: 3.0, basis: prior}  # statewide, race-shared (fit overrides)
  sd_per_poll: {value: 0.0, basis: prior}     # per-poll, / n_eff (fit overrides)
  sd_nonsampling_house: {value: 3.0, basis: prior}  # district polls: a larger race-shared part
  # sd_nonsampling and sd_per_poll are overwritten by the statewide backtest
  # fit (data/backtest_statewide.yaml) when present
  sd_partisan: {value: 3.5, basis: prior}     # extra sd, scaled by sponsored-poll share
  trend_lambda: {value: 1.0, basis: prior}

ratings:
  sd: {value: 5.5, basis: prior}      # race-level; deliberately not fit (backtest ratings_fit.sd_note)
  k: {value: 1.0, basis: prior}       # anchor rescale; fit overrides (~1.25)
  raters: [Cook, Sabato, Inside Elections]
