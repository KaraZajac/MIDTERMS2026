# When the polls close on Election Day, Nov 3, 2026, in Eastern time (EST,
# UTC-5): hours after midnight Nov 3, so 19.5 is 7:30 p.m. ET and 24 is
# midnight. `first` is when the first polls in the state close and `last`
# when the last do: a state split across time zones closes in two steps, and
# New Hampshire's towns close at 7 or 8. Networks and decision desks call a
# statewide race only after `last`. `races` lists districts whose polls all
# close at a different time from the state's window.
#
# Exported in live.json (polls_close) as UTC timestamps for the site's
# "polls close" lines and the night's schedule.

source:
  name: 270toWin, "Poll Closing Times"
  url: https://www.270towin.com/poll-closing-times
  fetched: "2026-11-03"
  note: latest closing time in each state and time zone; individual polling places may close earlier

