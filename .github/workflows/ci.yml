name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pyyaml numpy

      - name: Validation gate (races, polls, forecast)
        run: python -m midterms verify

      - name: Unit tests
        run: python -m unittest discover -s tests -q

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Browser simulator parity (sim/simulator.mjs vs the Python forecast)
        run: node sim/simulator.test.mjs
