# Every six hours: re-pull the race pages (polls, ratings, nominees), the
# VoteHub poll feed and FEC filings, rebuild data/, rerun the forecast and
# commit what changed.
#
# Before the deadline (polls open, 10:00 UTC Nov 3) each run freezes a
# timestamped snapshot into data/forecast/snapshots/ — the last one before
# the deadline is the forecast that gets scored. On election morning the
# job runs hourly until 08:17 UTC, so the record catches Monday night's
# last polls even when GitHub delays or drops a scheduled run (it ran the
# 12:17 UTC slot at 13:30 on Nov 1, and skipped 06:17 entirely). A run
# that starts in the last half hour before the deadline stands down, so
# every snapshot that can count is committed, and git-timestamped, before
# polls open. After the deadline the
# same job stops forecasting and starts scoring: results boxes fill in on
# Wikipedia, `midterms score` grades the frozen snapshot, and the
# scorecard is committed as races resolve.
#
# Partisan lean is rebuilt from the committed data/lean/ tables (its raw
# block-level sources are ~125 MB and don't change).

name: refresh

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "17 1-5,7,8 3 11 *"     # Nov 3: with the line above, hourly 00:17–08:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Phase
        id: phase
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [[ "$now" > "2026-11-03T09:30:00Z" && "$now" < "2026-11-03T10:00:00Z" ]]; then
            echo "hold=true" >> "$GITHUB_OUTPUT"
            echo "$now: within half an hour of the 10:00 UTC deadline — standing down"
          else
            echo "hold=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.phase.outputs.hold != 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.phase.outputs.hold != 'true'
        run: pip install pyyaml numpy

      - name: Pull (race pages, VoteHub polls, FEC)
        if: steps.phase.outputs.hold != 'true'
        # pollster ratings are pinned in data/pollster_ratings/ (Silver
        # Bulletin's file has needed a login since Nov 1)
        run: python -m midterms pull --only wiki --only votehub --only fec --force

      - name: Build
        if: steps.phase.outputs.hold != 'true'
        run: python -m midterms build

      - name: Forecast (before the deadline) or score (after)
        if: steps.phase.outputs.hold != 'true'
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [[ "$now" < "2026-11-03T10:00:00Z" ]]; then
            python -m midterms forecast --snapshot
          else
            python -m midterms score
          fi

      - name: Verify
        if: steps.phase.outputs.hold != 'true'
        run: |
          python -m midterms verify
          python -m unittest discover -s tests -q

      - name: Seal the forecast of record (first run after the deadline)
        if: steps.phase.outputs.hold != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [[ "$now" > "2026-11-03T10:00:00Z" ]] && ! gh release view forecast-of-record >/dev/null 2>&1; then
            snap=$(python - <<'PY'
          import json, pathlib
          snaps = sorted(pathlib.Path("data/forecast/snapshots").glob("*.json"))
          ok = [p for p in snaps if json.loads(p.read_text())["generated"] < "2026-11-03T10:00:00Z"]
          print(ok[-1] if ok else "")
          PY
            )
            if [ -n "$snap" ]; then
              gh release create forecast-of-record "$snap" --target "$(git log -1 --format=%H -- "$snap")" \
                --title "The forecast of record — $(basename "$snap" .json)" \
                --notes "The last forecast generated before polls opened on Election Day (2026-11-03T10:00Z). This snapshot, unchanged, is what the scorecard grades. See README.md and docs/method.md."
            fi
          fi

      - name: Commit if substantively changed
        if: steps.phase.outputs.hold != 'true'
        run: |
          git config user.name "midterms-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add -A data README.md
          if git diff --cached --quiet -I'^generated:' -I'^  fetched:' -I'^asof:'; then
            echo "no substantive changes"
          else
            git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%MZ) — polls, ratings, forecast"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main || exit 1
              [ "$i" = 3 ] && exit 1
            done
          fi
