# The refresh: re-pull the race pages (polls, ratings, nominees), the
# VoteHub poll feed and FEC filings, rebuild data/, rerun the forecast and
# commit what changed.
#
# The job keeps its own clock (midterms/pipeline/cadence.py), because
# GitHub's scheduler runs cron jobs late or drops them under load: on Nov 1
# it skipped 06:17 UTC, ran 12:17 at 13:30 and 18:17 at 22:05. Each run
# ends by waiting for the next slot and dispatching it, and the cron
# entries are only a watchdog that restarts the chain if it ever breaks.
#
#   until Nov 3 09:30 UTC   every 30 min: forecast + timestamped snapshot
#                           (the last snapshot before polls open, 10:00 UTC,
#                           is the forecast that gets scored; nothing starts
#                           in the last half hour, so every snapshot that can
#                           count is committed, and git-timestamped, in time)
#   Nov 3 10:00–23:00       hourly: score (seals the forecast of record)
#   from Nov 3 23:00        results: every 10 min overnight (live results
#                           and Wikipedia's results boxes + scoring each run),
#                           then every 30 min, then hourly; the chain ends Nov 10
#                           and the six-hourly cron keeps scoring (runoffs)
#
# Partisan lean is rebuilt from the committed data/lean/ tables (its raw
# block-level sources are ~125 MB and don't change); pollster ratings are
# pinned in data/pollster_ratings/.

name: refresh

on:
  schedule:
    - cron: "17 * 1-9 11 *"         # watchdog: hourly while the chain should be running
    - cron: "17 */6 * * *"          # and the long-run cadence after it ends
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write                    # each run dispatches the next

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: refresh
      cancel-in-progress: false
    outputs:
      chain: ${{ steps.phase.outputs.chain }}
      next: ${{ steps.phase.outputs.next }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pyyaml numpy

      - name: Phase
        id: phase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow refresh.yml --limit 30 \
            --json databaseId,event,status,createdAt > "$RUNNER_TEMP/runs.json" || echo "[]" > "$RUNNER_TEMP/runs.json"
          python -m midterms cadence --event "${{ github.event_name }}" --run-id "${{ github.run_id }}" \
            --runs "$RUNNER_TEMP/runs.json" | tee -a "$GITHUB_OUTPUT"

      - name: Pull
        if: steps.phase.outputs.work == 'true' && steps.phase.outputs.full == 'true'
        run: |
          case "${{ steps.phase.outputs.phase }}" in
            forecast) python -m midterms pull --only wiki --only votehub --only fec --force ;;
            *)        python -m midterms pull --only wiki --force ;;
          esac

      - name: Build
        if: steps.phase.outputs.work == 'true' && steps.phase.outputs.full == 'true'
        run: python -m midterms build

      - name: Forecast (before the deadline) or score (after)
        if: steps.phase.outputs.work == 'true' && steps.phase.outputs.full == 'true'
        run: |
          if [ "${{ steps.phase.outputs.phase }}" = forecast ]; then
            python -m midterms forecast --snapshot
          else
            python -m midterms score
          fi

      # after the deadline: counts and calls from civicAPI, and the forecast of
      # record conditioned on the calls -> data/site/live.json (the web server
      # runs the same command every minute; this copy is the record)
      - name: Live results
        if: ${{ !cancelled() && steps.phase.outputs.work == 'true' && steps.phase.outputs.phase != 'forecast' }}
        run: python -m midterms live || echo "::warning::no live results this run (civicAPI unreachable?)"

      - name: Verify
        id: verify
        if: ${{ !cancelled() && steps.phase.outputs.work == 'true' }}
        run: |
          python -m midterms verify
          python -m unittest discover -s tests -q

      - name: Seal the forecast of record (first run after the deadline)
        if: steps.phase.outputs.work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [[ "$now" > "2026-11-03T10:00:00Z" ]] && ! gh release view forecast-of-record >/dev/null 2>&1; then
            snap=$(python - <<'PY'
          import json, pathlib
          snaps = sorted(pathlib.Path("data/forecast/snapshots").glob("*.json"))
          ok = [p for p in snaps if json.loads(p.read_text())["generated"] < "2026-11-03T10:00:00Z"]
          print(ok[-1] if ok else "")
          PY
            )
            if [ -n "$snap" ]; then
              gh release create forecast-of-record "$snap" --target "$(git log -1 --format=%H -- "$snap")" \
                --title "The forecast of record — $(basename "$snap" .json)" \
                --notes "The last forecast generated before polls opened on Election Day (2026-11-03T10:00Z). This snapshot, unchanged, is what the scorecard grades. See README.md and docs/method.md."
            fi
          fi

      - name: Commit if substantively changed
        if: ${{ !cancelled() && steps.phase.outputs.work == 'true' && steps.verify.outcome == 'success' }}
        run: |
          git config user.name "midterms-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add -A data README.md
          if git diff --cached --quiet -I'^generated:' -I'^  fetched:' -I'^asof:'; then
            echo "no substantive changes"
          else
            case "${{ steps.phase.outputs.phase }}" in
              forecast) what="polls, ratings, forecast" ;;
              *)        what="results, scorecard" ;;
            esac
            git commit -m "refresh: $(date -u +%Y-%m-%dT%H:%MZ) — $what"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main || exit 1
              [ "$i" = 3 ] && exit 1
            done
          fi

  # Wait for the next slot, then start it. Outside the refresh job's
  # concurrency group, so a manual run can start while this one waits; the
  # newest dispatched run always carries the chain.
  next:
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.outputs.chain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Dispatch the next refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXT: ${{ needs.refresh.outputs.next }}
        run: |
          wait=$(( NEXT - $(date -u +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "next refresh at $(date -u -d "@$NEXT" +%Y-%m-%dT%H:%MZ) — waiting ${wait}s"
            sleep "$wait"
          fi
          newer=$(gh run list --workflow refresh.yml --event workflow_dispatch --limit 20 \
                    --json databaseId --jq "[.[] | select(.databaseId > ${{ github.run_id }})] | length")
          if [ "${newer:-0}" -gt 0 ]; then
            echo "a newer dispatched refresh carries the chain"
            exit 0
          fi
          gh workflow run refresh.yml --ref main
